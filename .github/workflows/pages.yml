name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Rebuild and verify reference data
        run: |
          python3 research/build_inventory.py --check
          python3 db/build_db.py
          python3 db/build_scoring.py
          git diff --exit-code -- site/data site/scoring/data
          node tests/search.test.cjs
          node tests/scoring.test.cjs
          node --check site/scoring/app.js
          node --check site/scoring/sw.js
          node --check site/app.js
          node --check site/search.js
          node --check site/sw.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
